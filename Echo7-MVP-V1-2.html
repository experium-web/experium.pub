    <div class="brand"><span class="brand-mark">E<span>7</span></span><span><b>EXPERIUM</b><small>TIDE / VIVRE L'EXPÉRIENCE</small></span></div>
    <div class="header-right"><span class="prototype-tag">LABORATOIRE LOCAL · V1.2</span><button id="mediaTop" type="button" class="ghost-button">Catalogue médias</button> <button id="resetTop" type="button" class="ghost-button">↺ Recommencer</button></div>

</div>
<script>
/* ÉCHO-7 — données de conception : médias décrits, non encore créés. */
window.ECHO7_DATA = (()=>{
  const stations=[
    {id:'P01',name:'Navigation',icon:'◎',focus:'Planète, cartes orbitales et trajectoires'},
    {id:'P02',name:'Communications',icon:'◉',focus:'Réception, émission et analyse des signaux'},
    {id:'P03',name:'Archives',icon:'▤',focus:'Mémoire, dossiers et témoignages'},
    {id:'P04',name:'Systèmes',icon:'⚡',focus:'Énergie, sécurité et intégrité du vaisseau'}
  ];
  const make=(id,title,cost,pts,medium,sceneTitle,script,secondary,next,flags=[])=>({id,title,cost,pts,medium,sceneTitle,script,secondary,next,flags,
    mediaId:`E7-M-${id}`,audioId:`E7-A-${id}`});
  const d1={
    P01:[
      make('D01-P01-A','Cartographier la marée de Nacre',2,[3,0,1],'Projection · fenêtre principale','Les orbites qui se dédoublent',`Les points lumineux qui encerclent Nacre dessinent une carte incomplète. Puis, sous vos yeux, la même trajectoire apparaît deux fois. La première suit le mouvement attendu d'un objet autour de la planète; la seconde semble précéder de plusieurs secondes sa propre position.\n\nL'ordinateur affiche : « Deux relevés cohérents. Une seule origine physique. » La planète se dédouble pendant un battement de cœur. Les quatre consoles reçoivent la mention : ANOMALIE DE PHASE SUSPECTÉE.`, 'L’étude des trajectoires enrichit les relevés du vaisseau.','P01 / D02 : recouper les deux trajectoires et dater leur écart.',['orbite']),
      make('D01-P01-B','Suivre le cinquième écho radar',1,[1,1,2],'Projection · SAS + son spatialisé','Une trajectoire traverse la coque',`Une petite trace s'éloigne de Nacre et vient s'immobiliser contre le pictogramme d'ÉCHO-7. La carte s'agrandit. Le point lumineux semble maintenant circuler à l'intérieur du vaisseau, sans suivre aucun corridor connu.\n\nTrois coups résonnent près du SAS. Sur la carte, la trace s'arrête exactement au même endroit. Puis elle disparaît. L'ordinateur n'affiche qu'un mot : « Improbable. »`, 'La présence du cinquième écho devient un enjeu de localisation.','P01 / D02 : retrouver la trace au voisinage du SAS.',['echo']),
      make('D01-P01-C','Calculer un corridor de sortie',2,[0,1,3],'Projection · fenêtre principale','Une route hors de portée',`Nacre pivote sous l'image d'un corridor orbital. Une voie de sortie s'allume en vert, puis trois autres points deviennent rouges. Des déformations gravitationnelles coupent la route, comme si l'espace lui-même avait été plié.\n\nLe système annonce : « Un corridor de départ existe. Il ne restera pas ouvert indéfiniment. » Une petite minuterie s'installe dans un coin de la fenêtre. Pour la première fois, les joueurs voient qu'ÉCHO-7 pourrait peut-être quitter cette région.`, 'Une voie d’évacuation est envisagée, sans la rendre obligatoire.','P01 / D02 : évaluer la descente ou la sortie orbitale.',['corridor'])
    ],
    P02:[
      make('D01-P02-A','Comparer les deux fréquences de Mara',1,[2,2,0],'Télévision · analyse des transmissions','Deux voix, une même empreinte',`La télévision affiche deux formes d'onde presque identiques. Les mots de Mara se superposent : « Ne rétablissez pas… » et « Vous êtes leur seule chance… » À l'écran, les deux signatures vocales deviennent une seule courbe.\n\nUn rapport confirme une correspondance totale, mais révèle un décalage inexplicable entre l'émission et la réception. Les contradictions de Mara ne sont peut-être pas de simples mensonges.`, 'Les signatures des deux messages sont corrélées; les joueurs peuvent les examiner plus finement.','P02 / D02 : isoler une phrase ou la signature temporelle.',['frequence']),
      make('D01-P02-B','Envoyer un accusé de réception',2,[0,3,1],'Télévision · vidéo de transmission + voix','Quelqu’un répond avant la fin',`Une série d'impulsions traverse l'écran. L'ordinateur annonce : « Message d'accusé de réception émis. » Puis, avant même la fin de la dernière impulsion, une voix crépite dans les haut-parleurs.\n\n« Je sais que vous êtes réveillés. » La voix ressemble à celle de Mara, mais son souffle est si proche qu'elle semble parler de la pièce voisine. « N'ouvrez pas… » Le signal coupe brutalement avant de préciser quoi.`, 'Le canal devient actif et attire de nouvelles réponses; exposition accrue.','P02 / D02 : prolonger ou interroger la voix répondante.',['reponse']),
      make('D01-P02-C','Isoler les communications entrantes',1,[0,0,3],'Son · rupture des parasites + écran TV','Le silence n’est pas vide',`Les parasites disparaissent. La forme d'onde se réduit à une ligne droite et la télévision affiche : CANAL FERMÉ. Pendant un instant, le cockpit paraît retrouver son souffle.\n\nPuis trois coups secs résonnent derrière le SAS, plus distinctement qu'auparavant. Ils ne viennent d'aucun haut-parleur de transmission actif. Le calme n'a fait que déplacer le mystère.`, 'Le canal est isolé; une restauration ultérieure coûtera davantage.','P02 / D02 : rouvrir brièvement une liaison ou étudier le silence.',['isole'])
    ],
    P03:[
      make('D01-P03-A','Consulter le journal scientifique',0,[2,0,1],'Télévision · archives illustrées','L’expérience interdite',`Le logo d'un laboratoire apparaît sur la télévision. Une succession d'images montre Nacre, une antenne et une étrange spirale de données. À la fin du journal, un scientifique a souligné une seule phrase : « Le signal a été reçu avant d'être émis. »\n\nLe fichier s'interrompt avant la conclusion. Un avertissement : PROTOCOLE NON VALIDÉ. Vous savez désormais qu'un incident scientifique a précédé votre réveil, sans comprendre encore pourquoi il vous concerne.`, 'Le journal conserve une trace de l’essai temporel initial.','P03 / D02 : chercher l’expérience ayant précédé l’effacement.',['essais']),
      make('D01-P03-B','Rechercher Mara Voss',0,[0,3,1],'Télévision · portrait et archives','Un nom, une enfant',`Une photographie d'officier apparaît : MARA VOSS. Puis une deuxième fiche se glisse sous la première. LIA VOSS, ONZE ANS. Un lien de filiation s'affiche. Derrière le nom de Lia, le mot « REFUGE » apparaît en lettres rouges.\n\nUne voix enfantine, lointaine, dit : « Mara? » Le SAS demeure immobile. Les deux messages contradictoires prennent soudain une dimension personnelle.`, 'Le lien familial relie Mara au sort du refuge de Nacre.','P03 / D02 : examiner le dossier de Lia et la liste des réfugiés.',['mara']),
      make('D01-P03-C','Examiner les dossiers neurologiques',0,[2,1,1],'Télévision · dossier médical','Les quatre signatures effacées',`Quatre profils médicaux identiques se déploient à l'écran. Chaque fiche porte la même mention : EFFACEMENT MNÉSIQUE VOLONTAIRE. Une cinquième fiche est marquée REFUS DE LA PROCÉDURE.\n\nL'ordinateur demande de confirmer l'identité des occupants. Personne ne peut répondre. Une courte note manuscrite apparaît : « Nous avons accepté. Tous les quatre. » Ce qui ressemblait à un accident prend la forme d'une décision passée.`, 'L’amnésie devient un acte consenti et non un simple défaut système.','P03 / D02 : retrouver le protocole 7-C et son motif.',['memoire'])
    ],
    P04:[
      make('D01-P04-A','Calibrer les capteurs',2,[2,0,1],'Projection · fenêtre et diagnostic','Une présence en trop',`Les indicateurs des quatre places s'allument, puis une cinquième source vitale clignote brièvement sur le plan du cockpit. Le scanner élimine les erreurs de mesure habituelles. Le cinquième point demeure.\n\nUne séquence d'images délavées montre l'empreinte d'une personne assise à l'endroit du siège vide. Puis le point s'efface, comme si l'ordinateur l'avait aperçu trop tôt.`, 'Capteurs recalibrés : une source anormale peut être suivie.','P04 / D02 : scanner le SAS à haute précision.',['capteurs']),
      make('D01-P04-B','Alimenter le relais principal',2,[0,2,0],'Télévision · système de puissance','Le canal qui absorbe tout',`Sur les indicateurs, une importante partie de l'énergie est dirigée vers le relais principal. La télévision s'allume avec une transmission incomplète. Une voix répète deux fois le même mot, chaque répétition légèrement en avance sur l'autre.\n\nUne alarme avertit : « Résonance probable si le canal demeure bidirectionnel. » Le relais est prêt à fonctionner, mais aucun occupant ne sait encore s'il faut l'utiliser.`, 'Le relais principal est alimenté; une prochaine action peut exploiter ou refroidir le système.','P04 / D02 : limiter la surchauffe ou choisir la continuité du relais.',['relais']),
      make('D01-P04-C','Renforcer les protections du SAS',1,[0,0,3],'Projection · SAS + bruit mécanique','La porte tient. Pour l’instant.',`Des lignes lumineuses encadrent le SAS. Les joints de pression se ferment les uns après les autres. L'ordinateur annonce : « Compartiment isolé. Risque de dépressurisation réduit. »\n\nAu moment précis où le dernier joint se verrouille, trois coups se font entendre de l'autre côté. La caméra de surveillance ne montre rien. L'indicateur d'intégrité reste pourtant vert.`, 'Le SAS est isolé et la sécurité est prioritaire.','P04 / D02 : sonder les joints et la pression du compartiment.',['sas'])
    ]
  };
  // Chaque option D01 ouvre une option spécifique en position A sur le même podium à D02.
  const followUps={
    P01:{
      A:make('D02-P01-A1','Recouper les trajectoires à 04:22',1,[3,0,1],'Projection · fenêtre principale','Le décalage de quatre minutes',`Deux orbites apparaissent autour de Nacre. La seconde passe par un point qui n'a pas encore été atteint. Les horodatages défilent, puis se figent sur 04:22. L'ordinateur annonce : « Le relevé futur est cohérent avec vos capteurs. »\n\nLes trajectoires ne décrivent pas deux objets différents. Elles semblent montrer le même objet à deux instants qui se chevauchent.`, 'Les données temporelles deviennent plus crédibles.','D03 : accès à une hypothèse de boucle temporelle.', ['chronologie']),
      B:make('D02-P01-A2','Localiser la trace près du SAS',1,[1,2,2],'Projection · SAS + son','Une ombre sans trajectoire',`Le radar zoome sur le SAS. Une silhouette traverse l'image thermique, puis disparaît avant d'atteindre la porte. Les coups de la coque surviennent au même instant, mais un peu trop tôt pour correspondre au mouvement.\n\nLe rapport indique : « Source enregistrée; localisation non vérifiée. » Quelque chose était-il là, ou s'agit-il d'une image d'un autre moment?`, 'Une présence localisée devient une hypothèse crédible.','D03 : accès à une investigation du cinquième occupant.', ['presence']),
      C:make('D02-P01-A3','Tester la route de sortie de Nacre',2,[0,1,3],'Projection · fenêtre principale','Un passage se referme',`Une trajectoire verte se forme entre ÉCHO-7 et l'espace profond. Au même moment, un anneau lumineux entoure Nacre, et le corridor se rétrécit rapidement. Le système calcule une fenêtre de départ limitée.\n\nQuitter Nacre pourrait être possible, mais il faudra choisir avant que la marée n'atteigne sa pleine intensité.`, 'La trajectoire de sortie reste une possibilité cohérente.','D03 : option de préparation au départ.', ['depart'])
    },
    P02:{
      A:make('D02-P02-A1','Isoler la phrase cachée dans les messages',1,[2,3,0],'Télévision · décomposition des signaux','Une phrase entre deux futurs',`La télévision superpose les deux messages de Mara. Un fragment apparaît entre deux parasites : « Je ne vous ai jamais demandé de me croire. » Les horodatages restent impossibles à réconcilier.\n\nLa correspondance vocale est parfaite, mais l'une des prises semble avoir été enregistrée bien après l'autre. Un deuxième niveau de narration devient accessible.`, 'Le groupe comprend mieux la contradiction sans trancher entre les voix.','D03 : transmission partielle provenant d’un autre instant.', ['empreinte']),
      B:make('D02-P02-A2','Prolonger l’échange avec la voix',2,[0,3,1],'Télévision · communication en direct','La réponse qui précède la question',`Une silhouette brouillée se forme sur l'écran de transmission. « Vous avez enfin répondu », dit Mara. Une nouvelle ligne apparaît avant que les joueurs n'aient pu envoyer quoi que ce soit : RÉPONSE ENREGISTRÉE.\n\nLa voix reprend : « Ne laissez pas la porte s'ouvrir. » Puis le signal s'éteint, comme si quelqu'un avait coupé la liaison à l'autre bout.`, 'Le signal devient plus personnel et plus inquiétant.','D03 : communication directe ou isolement de la voix.', ['contact']),
      C:make('D02-P02-A3','Rouvrir un canal de secours de trois secondes',2,[1,2,2],'Télévision · courte transmission','Trois secondes de trop',`Le canal n'est ouvert que pour trois secondes. Cela suffit pour entendre un fragment d'appel : « Ici Nacre… quarante-trois… » Puis une autre voix répète la même phrase avant le premier enregistrement.\n\nQuand le canal se referme, la télévision reste noire. Derrière le SAS, un bruit répond aux mots qui viennent d'être reçus.`, 'La liaison reste limitée; le refuge paraît réel sans dissiper le danger.','D03 : conserver ou effacer les coordonnées reçues.', ['secours'])
    },
    P03:{
      A:make('D02-P03-A1','Retrouver l’essai scientifique initial',0,[3,0,1],'Télévision · archives d’expérience','Le message avant son origine',`Le journal présente un exercice banal : transmettre une suite de cinq chiffres. Les chiffres apparaissent sur le récepteur avant que la main de l'opérateur touche l'émetteur. L'image s'arrête à l'instant de l'essai.\n\nUne note avertit : « La mesure a modifié l'expérience. » Le rapport suivant, qui devrait expliquer pourquoi, est corrompu.`, 'L’histoire reçoit une preuve scientifique tangible.','D03 : consultation du protocole de mémoire.', ['essai_initial']),
      B:make('D02-P03-A2','Ouvrir le dossier de Lia Voss',0,[0,3,2],'Télévision · portrait / voix enfantine','La voix derrière la cloison',`Le dossier de Lia révèle qu'elle est au refuge avec quarante-deux autres personnes. Un enregistrement audio porte la date de la dernière évacuation : « Maman, on descend. Promets-moi que tu nous retrouveras. »\n\nTrois coups résonnent dans la coque. Cette fois, ils semblent répondre à la voix de l'enfant.`, 'Le choix de porter secours devient un enjeu émotionnel.','D03 : piste de Lia et du refuge renforcée.', ['lia']),
      C:make('D02-P03-A3','Extraire le protocole 7-C',0,[2,1,2],'Télévision · archives médicales','La permission d’oublier',`Une courte vidéo de Mara montre quatre sièges médicaux. Elle s'adresse à des personnes hors champ : « Vous avez accepté. Après cette procédure, vous pourrez de nouveau choisir sans connaître d'avance toutes les conséquences. »\n\nLa vidéo se termine sur quatre signatures de consentement sans nom. L'effacement n'a pas été subi. Il avait été demandé.`, 'Une responsabilité passée est établie.','D03 : approfondissement du motif de l’effacement.', ['consentement'])
    },
    P04:{
      A:make('D02-P04-A1','Scanner le SAS à haute précision',1,[2,1,2],'Projection · SAS + biométrie','Un cinquième pouls',`Le SAS apparaît en coupe. Aucun corps n'est détecté. Pourtant, le capteur affiche pendant deux secondes un cinquième pouls, puis l'efface. La courbe de chaleur se situe exactement à l'endroit du siège vide.\n\nL'ordinateur conclut : « Anomalie biologique sans volume détectable. » Trois coups résonnent juste après.`, 'Le SAS devient une piste majeure sans exiger une présence visible.','D03 : approfondissement du mystère du cinquième occupant.', ['sas_scan']),
      B:make('D02-P04-A2','Limiter la surchauffe du relais',1,[1,2,2],'Télévision · diagramme énergétique','La puissance à double tranchant',`La température du relais principal diminue, mais une simulation avertit que le signal pourrait reboucler pendant la marée. Une voie secondaire apparaît brièvement dans le diagnostic.\n\nLe vaisseau annonce : « Il existe une autre voie de transmission. Puissance insuffisante à ce stade. » L'ordinateur ferme l'onglet avant de détailler le circuit.`, 'Une solution de transmission prudente se dessine.','D03 : recherche d’un mode de transmission sans retour.', ['auxiliaire']),
      C:make('D02-P04-A3','Tester l’étanchéité du SAS',1,[0,1,3],'Projection · SAS + acoustique','Les trois coups de l’autre côté',`Les joints sont étanches. Les pressions sont égales et aucun mouvement n'est détecté. Puis trois coups résonnent comme à travers une coque métallique, de l'extérieur vers l'intérieur.\n\nLe système affirme : « Aucun contact physique enregistré. » Mais un capteur sonore révèle une vibration datée de plusieurs minutes plus tard.`, 'La protection marche, mais n’explique pas la vibration.','D03 : option d’isolement durable ou de vérification temporelle.', ['joint_sas'])
    }
  };
  const d2Other={
    P01:[
      make('D02-P01-B','Observer une silhouette orbitale inconnue',1,[1,2,2],'Projection · fenêtre / radar','L’ombre au-dessus des nuages',`Une forme sombre traverse brièvement l'image de Nacre, puis se retrouve sur l'écran radar à un emplacement impossible. Elle n'a pas accéléré : c'est l'ordre des mesures qui semble inversé.\n\nLa trace disparaît au moment où trois coups résonnent dans la coque.`, 'Renforce la piste d’une présence anormale.','D03 : possibilité d’interpréter la présence ou de l’ignorer.',['ombre']),
      make('D02-P01-C','Calculer un retour vers une orbite stable',2,[1,0,3],'Projection · fenêtre principale','Une route de repli',`La fenêtre principale montre Nacre se décaler lentement tandis qu'un corridor apparaît en filigrane. Les calculs laissent entrevoir une route de survie, mais la marée risque de la fermer.\n\nL'ordinateur demande de conserver cette trajectoire jusqu'à la prochaine phase.`, 'Conserve l’idée d’un départ viable.','D03 : possibilité de prioriser la trajectoire de survie.', ['route'])
    ],
    P02:[
      make('D02-P02-B','Écouter les derniers appels du refuge',1,[0,3,2],'Télévision · fichier enregistré','Quarante-trois vies',`Une liste de noms apparaît sous une transmission faible. Des voix se superposent, certaines inquiètes, d'autres résolument calmes. Une femme annonce qu'il reste des réserves, mais que les communications sont perdues.\n\nUne fillette demande si quelqu'un reviendra. L'écran revient au silence.`, 'Renforce la connaissance du refuge et le lien moral.','D03 : ouverture d’un canal de secours ou décision de protéger l’équipage.', ['refuge']),
      make('D02-P02-C','Transmettre un court message sans réponse',2,[2,2,1],'Télévision · impulsion codée','Un appel qui ne demande rien',`L'antenne émet une impulsion très courte, sans tenter d'établir de dialogue. L'écran n'affiche qu'une confirmation de départ. Aucun destinataire n'est assuré.\n\nLa transmission semble passer derrière la planète, là où la marée commence à déformer les étoiles.`, 'Le groupe teste la possibilité d’un signal unidirectionnel.','D03 : recherche d’un relais auxiliaire.', ['signal_court'])
    ],
    P03:[
      make('D02-P03-B','Comparer les cinq identités d’équipage',0,[1,2,2],'Télévision · dossiers biométriques','Le cinquième absent',`Les quatre fiches effacées s'alignent à l'écran. La cinquième porte le nom de Mara, mais sa photo semble datée d'une autre journée. Les archives ne parviennent pas à confirmer sa dernière position.\n\nLa note suivante a été effacée à la main : « La personne qui manque n'est pas forcément celle qui est partie. »`, 'Un doute subsiste sur l’identité du cinquième siège.','D03 : enquête sur la présence ou l’amnésie.', ['identites']),
      make('D02-P03-C','Afficher les instructions avant effacement',0,[2,1,2],'Télévision · note manuscrite','La décision oubliée',`Quatre marques de consentement apparaissent sous un document endommagé. La consigne restante est brève : « Ne reproduisez pas le choix par habitude. »\n\nUne deuxième phrase, partiellement effacée, évoque « ce qui nous avait répondu ». Le dossier se verrouille.`, 'Révèle que les protagonistes voulaient éviter une répétition.','D03 : nouvelle manière d’interpréter les messages contradictoires.', ['notes'])
    ],
    P04:[
      make('D02-P04-B','Transférer l’énergie de secours vers la survie',-2,[0,0,3],'Son · vaisseau stabilisé','Le cockpit respire à nouveau',`Les voyants critiques reviennent au bleu. La ventilation ralentit et les alarmes se taisent. La réserve opérationnelle augmente de deux unités, mais l'ordinateur avertit que des relevés scientifiques temporaires devront être abandonnés.\n\nLa sécurité progresse, au prix d'informations perdues.`, 'Récupère deux unités d’énergie et efface certains relevés.','D03 : des options énergivores deviennent possibles, mais une archive est perdue.', ['economie']),
      make('D02-P04-C','Mettre le compartiment en confinement',1,[0,1,3],'Projection · SAS / son mécanique','La porte sous tension',`Les joints du SAS se resserrent, l'éclairage passe à l'orange et un avertissement confirme que le compartiment restera fermé jusqu'au prochain diagnostic.\n\nDerrière la porte, un frottement se fait entendre. Un deuxième capteur reste parfaitement silencieux.`, 'La protection du compartiment est priorisée.','D03 : état de SAS confiné conservé.', ['confinement'])
    ]
  };
  function getD02(d01Picks){
    const out={};
    stations.forEach(s=>{
      const prior=(d01Picks[s.id]||'').slice(-1) || 'A';
      out[s.id]=[followUps[s.id][prior],...d2Other[s.id]];
    });
    return out;
  }
  return {stations,d1,getD02};
})();

</script>
<script>
/* ÉCHO-7 — suite D03, D04, conclusions. Les scènes sont des propositions littéraires, pas des médias réalisés. */
window.ECHO7_EXTRA = (()=>{
  const make=(id,title,cost,pts,medium,sceneTitle,script,secondary,next,flags=[])=>({id,title,cost,pts,medium,sceneTitle,script,secondary,next,flags,mediaId:`E7-M-${id}`,audioId:`E7-A-${id}`});
  const d3={
    P01:[
      make('D03-P01-A','Cartographier les échos temporels',1,[3,0,1],'Projection · fenêtre principale','Des routes superposées',`Les trajectoires autour de Nacre se déplacent les unes au travers des autres. L'une d'elles montre ÉCHO-7 à une position qu'il n'a pas encore atteinte. La projection s'arrête sur deux heures contradictoires.\n\nLa voix de bord explique qu'une carte n'indique plus seulement où l'on peut aller, mais peut-être aussi quand.`, 'La carte fournit un repère pour distinguer une anomalie temporelle d’un intrus.','D04 Navigation : aligner l’antenne hors de la boucle.',['phase_cartographie']),
      make('D03-P01-B','Localiser la trace autour du SAS',1,[1,3,1],'Projection · SAS + carte interne','La trace qui s’arrête à la porte',`Un point lumineux quitte l'orbite sur la carte puis réapparaît sur le plan intérieur du vaisseau. Il s'immobilise devant le SAS. L'écran affirme qu'aucun déplacement physique n'a été enregistré.\n\nTrois coups résonnent à l'endroit exact indiqué. L'espace semble contenir une adresse pour une présence que personne n'a vue.`, 'Une coordonnée anormale donne du poids à la piste du cinquième passager.','D04 Navigation : préparer une descente vers Nacre.',['trace_sas']),
      make('D03-P01-C','Évaluer la fenêtre d’évasion',0,[0,1,3],'Projection · fenêtre principale','La brèche dans l’orbite',`La planète glisse sous un corridor lumineux. Les trajectoires de retour s'alignent l'espace d'un instant, puis une alerte les recouvre : MARÉE IMMINENTE.\n\nL'ordinateur confirme qu'un départ reste possible si la propulsion est conservée. La route est étroite, mais elle est réelle.`, 'Le retour vers la civilisation reste une perspective concrète.','D04 Navigation : tracer une route de fuite.',['depart_possible'])
    ],
    P02:[
      make('D03-P02-A','Recouper les heures des deux messages',1,[3,1,0],'Télévision · analyse de transmission','Le futur parle deux fois',`La télévision affiche les voix de Mara côte à côte. Les horloges indiquent 04:09 et 04:22; les deux émissions paraissent appartenir à des événements encore à venir.\n\nUn signal se superpose à lui-même. Les ondes se rejoignent au même instant puis se séparent. L'hypothèse d'une boucle devient presque impossible à écarter.`, 'Le groupe dispose d’une preuve supplémentaire d’une origine temporelle.','D04 Communications : préparer un signal unidirectionnel.',['horodatages_d03']),
      make('D03-P02-B','Contacter l’origine des coups',1,[0,3,1],'Télévision · transmission / SAS','La voix à travers le métal',`Un canal interne grésille. Les trois coups cessent immédiatement. Une respiration se fait entendre, trop proche, puis une voix prononce un mot coupé avant qu'une identité puisse être confirmée.\n\nLa télévision affiche une destination impossible : SAS / ÉCHO-7. Le canal se ferme seul, mais son dernier écho subsiste sur les moniteurs.`, 'Une présence semble réagir à l’équipage, sans que son identité soit établie.','D04 Communications : maintenir une liaison avec le SAS.',['contact_sas']),
      make('D03-P02-C','Préserver le silence radio',0,[0,1,3],'Son · coupure des transmissions','Le confort du silence',`Une série de canaux se ferme. Le souffle électronique disparaît et l'habitacle retrouve le son régulier de sa ventilation.\n\nUne inscription demeure sur la télévision : AUCUN APPEL PRIORITAIRE NE SERA REÇU. Le repos obtenu a un prix, même si personne ne peut encore le mesurer.`, 'Les communications sont volontairement limitées pour protéger l’équipage.','D04 Communications : couper les émissions non essentielles.',['silence_radio'])
    ],
    P03:[
      make('D03-P03-A','Reconstituer le protocole d’effacement',1,[4,1,0],'Télévision · vidéo de Mara / archives','La mémoire qu’on a choisie de perdre',`Quatre formulaires de consentement apparaissent. Dans une vidéo de laboratoire, Mara explique que l'équipage a vu trop de futurs possibles pour agir sans les reproduire. L'effacement n'était pas une punition; c'était une tentative de rendre aux quatre occupants leur liberté.\n\nLa vidéo se termine sur un écran vide et une phrase : « Vous ne pourrez plus vous rappeler pourquoi il fallait oublier. »`, 'L’amnésie et la boucle temporelle deviennent compatibles dans une même explication.','D04 Archives : extraire les coordonnées du refuge.',['verite_amnesie']),
      make('D03-P03-B','Examiner le dossier du cinquième occupant',1,[0,4,1],'Télévision · dossiers / projection SAS','Le siège sans propriétaire',`MARA VOSS apparaît au-dessus d'une image dégradée du cinquième siège. Les registres placent sa signature biologique dans deux compartiments à des heures incompatibles. Une note supprimée porte les mots : « Ce qui répond n'est peut-être pas Mara. »\n\nLa lumière du SAS passe à l'orange. Derrière la porte, une silhouette traverse brièvement la projection, puis le capteur annonce : AUCUN VOLUME OCCUPÉ.`, 'La présence devient l’objet central du mystère, sans préciser si elle est humaine, biologique ou temporelle.','D04 Archives : identifier la présence inconnue.',['cinquieme_dossier']),
      make('D03-P03-C','Restaurer les ordres de mission',0,[1,0,4],'Télévision · enregistrement de mission','La consigne de revenir',`Un enregistrement très ancien révèle la mission d'ÉCHO-7 : observer la marée, survivre à l'incident et rapporter les données à la civilisation. Les instructions ne mentionnent ni sacrifice obligatoire ni intervention sur Nacre.\n\nUne route de retour se superpose au dossier. L'ordinateur conclut : « La mission peut encore être achevée. »`, 'La préservation de l’équipage peut correspondre à la mission initiale.','D04 Archives : restaurer le protocole de retour.',['ordre_retour'])
    ],
    P04:[
      make('D03-P04-A','Synchroniser les horloges de bord',1,[3,0,1],'Télévision · diagnostic temporel','Une seconde trop tôt',`Les consoles défilent à des vitesses différentes, puis se stabilisent. Pendant un instant, la cinquième signature vitale apparaît avec treize minutes d'avance sur les quatre autres.\n\nL'ordinateur signale qu'une source extérieure aux horloges contrôle la séquence des mesures. Les instruments cessent de clignoter, mais pas les interrogations.`, 'Les systèmes deviennent aptes à suivre les déphasages.','D04 Systèmes : préparation énergétique du relais.',['horloges']),
      make('D03-P04-B','Scanner le compartiment du SAS',1,[0,3,1],'Projection · SAS / sonar','Le battement derrière la porte',`Un balayage bleu traverse la porte projetée. Aucun corps n'est détecté, pourtant le scanner revient avec un signal biométrique supplémentaire. La pression du compartiment est normale.\n\nAu dernier balayage, trois impacts parcourent le métal. Le diagnostic indique qu'ils n'ont pas tous eu lieu au même instant.`, 'Le SAS peut être confiné, mais les causes de l’anomalie restent inconnues.','D04 Systèmes : préparer le confinement du SAS.',['scan_sas_d03']),
      make('D03-P04-C','Réserver la puissance de propulsion',0,[0,0,3],'Son · transfert de puissance','Une réserve pour partir',`Le ronronnement des moteurs devient plus profond. Une partie des circuits non essentiels s'éteint et la réserve de propulsion est préservée.\n\nUn message apparaît : AUTONOMIE DE DÉPART MAINTENUE. Le vaisseau pourra peut-être s'éloigner sans expliquer ce qui s'est passé.`, 'Les moteurs restent une option crédible à la conclusion.','D04 Systèmes : préparer le redémarrage.',['propulsion_reservee'])
    ]
  };
  const d4={
    P01:[
      make('D04-P01-A','Aligner l’antenne hors de la boucle',1,[3,1,0],'Projection · fenêtre principale','Une direction sans retour',`Une trajectoire étroite apparaît au-delà de la distorsion autour de Nacre. La fenêtre montre une impulsion franchissant la zone sans revenir.\n\nLe vaisseau annonce qu'un tel faisceau serait possible, mais qu'il priverait la navigation de ses réserves.`, 'Les coordonnées de secours sont orientées vers l’extérieur de la zone perturbée.','Bascule : appui technique à la solution A.',['antenne_alignee']),
      make('D04-P01-B','Calculer une descente contrôlée vers Nacre',1,[0,3,1],'Projection · fenêtre principale','Vers l’océan de Nacre',`Une route de descente apparaît sous la planète. Les nuages de Nacre se rapprochent; une zone de dégagement est identifiée à proximité des anciens refuges.\n\nL'ordinateur confirme qu'un atterrissage reste envisageable, mais qu'il ne pourra être improvisé après la marée.`, 'Un corridor de descente devient disponible si la confrontation l’exige.','Bascule : appui à la solution B.',['descente_calculee']),
      make('D04-P01-C','Tracer la route de fuite',0,[0,1,3],'Projection · fenêtre principale','Le chemin du retour',`Les orbites de sécurité s'allument une à une. La carte trace une direction nette loin de Nacre et des anomalies.\n\nL'ordinateur annonce : « Une voie de sortie demeure. » Le groupe sait qu'il pourrait partir sans jamais éclaircir le mystère.`, 'Le départ orbital devient la solution techniquement prioritaire.','Bascule : appui à la solution C.',['fuite_tracee'])
    ],
    P02:[
      make('D04-P02-A','Préparer le message de secours extérieur',1,[3,1,0],'Télévision · transmission codée','Le dernier appel possible',`Les noms des quarante-trois réfugiés défilent derrière un paquet de données comprimées. L'antenne affiche un seul cycle d'émission, sans canal de retour.\n\nUn brouillon de message se forme : « Nacre, refuge confirmé. Assistance demandée. » L'ordinateur attend la bascule finale.`, 'Le message aux secours est prêt à partir.','Bascule : contenu disponible pour A.',['message_secours']),
      make('D04-P02-B','Maintenir un contact interne avec le SAS',1,[0,3,1],'Télévision · voix et interférences','La réponse au seuil',`Les trois coups cessent. Un souffle traverse la télévision et une voix, peut-être celle de Mara, prononce : « Ne laissez pas la porte décider pour vous. »\n\nLe canal se met en attente. L'ordinateur conserve la fréquence pour la phase critique.`, 'Une communication confinée devient possible pendant la conclusion B.','Bascule : appui à la solution B.',['frequence_sas']),
      make('D04-P02-C','Couper les émissions non essentielles',0,[0,1,3],'Son · extinction des canaux','Ne plus répondre',`Les fréquences s'éteignent l'une après l'autre. Une dernière forme d'onde apparaît, comme pour réclamer votre attention, puis disparaît.\n\nLe vaisseau confirme que la route de départ ne sera plus perturbée par des transmissions sortantes.`, 'La communication est réduite pour faciliter le retour.','Bascule : appui à la solution C.',['emissions_coupees'])
    ],
    P03:[
      make('D04-P03-A','Extraire les coordonnées du refuge',0,[3,1,0],'Télévision · dossier du refuge','Quarante-trois coordonnées vitales',`Les noms des réfugiés s'alignent sous une carte des installations souterraines. Le dossier signale des réserves limitées et un canal de secours incertain.\n\nLes informations sont condensées en un paquet transmissible. Rien n'indique encore si quelqu'un lira ce paquet.`, 'Données de secours prêtes, même en cas de perte des archives.','Bascule : renforce A.',['coord_refuge']),
      make('D04-P03-B','Identifier la signature inconnue',0,[0,3,1],'Télévision · analyse biométrique','Un nom effacé dans la lumière',`Les dossiers comparent les traces associées au cinquième siège, au SAS et à Mara. Aucune correspondance ne reste stable.\n\nUn résultat partiel indique cependant que les signatures suivent le même décalage temporel. La présence semble liée à l'incident plutôt qu'à un simple passager clandestin.`, 'Une explication partielle de la présence accompagne l’option B.','Bascule : renforce B.',['signature_inconnue']),
      make('D04-P03-C','Restaurer le protocole de retour',0,[1,0,3],'Télévision · ordre de mission','Le rapport à ramener',`Un dossier scellé s'ouvre : tout observateur d'ÉCHO-7 doit quitter la zone en conservant une copie des données lorsque les systèmes deviennent instables.\n\nLe vaisseau prépare la capsule d'archives pour le voyage de retour. La mission scientifique peut continuer ailleurs.`, 'Les données importantes sont sauvegardées pour l’après-mission.','Bascule : renforce C.',['rapport_retour'])
    ],
    P04:[
      make('D04-P04-A','Préparer le transfert final vers l’émetteur',2,[4,1,0],'Télévision · circuits / fenêtre','Toute la lumière pour un signal',`Les lumières non essentielles baissent. L'écran montre le dernier transfert d'énergie vers l'antenne auxiliaire. Les moteurs deviennent silencieux.\n\nÉCHO-7 avertit : « Une fois l'émission lancée, la navigation autonome sera indisponible. » Le plan n'est pas encore exécuté, mais il a déjà un prix.`, 'Plan de sacrifice énergétique prêt, sans le déclencher immédiatement.','Bascule : finale A privilégiée si cohérente avec l’ensemble.',['transfert_prepare']),
      make('D04-P04-B','Préparer le confinement du SAS',2,[0,4,1],'Projection · SAS / alarmes','Le compartiment sous verrou',`Les joints du SAS se ferment tandis qu'une ombre traverse brièvement la porte projetée. La pression monte, puis se stabilise. Trois coups retentissent à travers la coque.\n\nL'ordinateur propose une procédure d'éloignement de la source : « Confinement possible. Descente orbitale requise. »`, 'Le confinement et la descente sont prêts à être engagés.','Bascule : finale B privilégiée si cohérente avec l’ensemble.',['sas_prepare']),
      make('D04-P04-C','Préparer le redémarrage de la propulsion',1,[0,1,4],'Projection · fenêtre / sons de moteurs','Les moteurs sous les étoiles',`Les voyants de propulsion s'allument; le bruit du moteur remplit l'habitacle. Nacre s'éloigne de quelques degrés dans la projection.\n\nL'ordinateur annonce : « Extraction orbitale possible. Les systèmes d'observation seront abandonnés. » Pour survivre, il faudra peut-être accepter de ne pas savoir.`, 'Le retour est préparé, sans condamner le sort des réfugiés.','Bascule : finale C privilégiée si cohérente avec l’ensemble.',['moteurs_prets'])
    ]
  };
  const finals={
    A:{id:'FIN-A',title:'A — Le dernier signal',subtitle:'Compréhension · sacrifice choisi',mediaId:'E7-M-FIN-A',audioId:'E7-A-FIN-A',medium:'Projection fenêtre + télévision + voix du vaisseau',script:`Les écrans convergent vers une même conclusion : la marée de phase peut faire revenir un message avant son émission. Les quatre occupants avaient effacé leurs souvenirs pour cesser de subir les futurs qu'ils croyaient connaître.\n\nLa réserve du vaisseau est détournée vers l'émetteur auxiliaire. Les coordonnées des quarante-trois réfugiés de Nacre quittent ÉCHO-7 sous la forme d'un signal unique. Aucune réponse ne reviendra. Une lumière traverse la fenêtre et se perd derrière le bord de la planète.\n\nLorsque la marée se dissipe, les moteurs ne répondent plus. L'équipage restera à la dérive, protégé pour l'instant par ses réserves vitales. Ils n'ont aucune garantie d'être retrouvés. Mais quelque part, au-delà des anomalies, une chance de secours existe désormais.\n\nTrois coups résonnent une dernière fois. Un rapport apparaît : « VERSION : 7 ». Il est impossible de savoir s'ils viennent de briser le cycle ou de lui donner un nouveau commencement.`,coda:'Ils ont choisi de transmettre. Ils devront désormais apprendre à attendre.'},
    B:{id:'FIN-B',title:'B — Le cinquième passager',subtitle:'Confrontation · rejoindre Nacre',mediaId:'E7-M-FIN-B',audioId:'E7-A-FIN-B',medium:'Projection SAS + fenêtre + communications',script:`Les anomalies convergent sur le compartiment du SAS. Le cinquième signal vital pulse au rythme des trois coups. L'analyse ne parvient pas à décider s'il s'agit de Mara, d'un intrus ou d'une présence née de la marée. Mais une chose est claire : les manifestations sont liées à cette porte.\n\nÉCHO-7 lance le confinement. Les joints se referment; la silhouette apparaît derrière la projection, puis se dédouble. Une décharge secoue la coque. Les instruments indiquent que l'événement est contenu, au moins pour cette traversée. Le vaisseau a toutefois perdu sa capacité de retour interstellaire.\n\nUne route demeure : la descente vers Nacre. À travers la fenêtre, les nuages de l'océan grandissent. Au dernier instant, une lumière marque une zone possible à proximité des refuges. La projection s'éteint juste avant le contact, laissant le sort de l'équipage à la surface ouvert, mais un objectif demeure : rejoindre les survivants.\n\nDans le silence après la descente, les haut-parleurs laissent entendre trois coups très faibles. Ils ne semblent plus venir du SAS.`,coda:'Ils ont choisi de faire face à l’inconnu. Ils ne le laisseront plus décider à leur place.'},
    C:{id:'FIN-C',title:'C — Ceux qui sont partis',subtitle:'Préservation · retour vers la civilisation',mediaId:'E7-M-FIN-C',audioId:'E7-A-FIN-C',medium:'Projection fenêtre + TV / voix du vaisseau',script:`Les quatre postes ont donné une priorité nette à la survie du vaisseau. Les communications sont ramenées au minimum, l'énergie est réservée à la propulsion et la route de retour se dessine au-delà de l'orbite de Nacre.\n\nLe moteur se rallume dans un grondement profond. La planète commence à s'éloigner derrière la fenêtre. Une dernière transmission non identifiée se présente, puis disparaît au moment où le vaisseau quitte la zone de marée. Personne ne saura si elle demandait de l'aide, si elle prévenait d'un danger ou si elle provenait d'un avenir qui n'aura pas lieu.\n\nLe retour vers la civilisation est engagé. Les archives conservées pourront un jour témoigner de ce qui s'est passé sur Nacre. L'équipage a sauvé sa vie et refuse de céder le contrôle du présent à un mystère.\n\nAlors que les étoiles reprennent un cours régulier, le journal de bord s'actualise : « SIGNES VITAUX : 4 ». Un instant plus tard, la valeur clignote, puis revient à quatre.`,coda:'Ils ont choisi de revenir. Mais ce qu’ils rapportent n’est pas tout ce qu’ils ont laissé derrière.'}
  };
  return {d3,d4,finals};
})();

</script>
<script>
(()=>{
'use strict';
const {stations,d1,getD02}=window.ECHO7_DATA;
const {d3,d4,finals}=window.ECHO7_EXTRA;
const STAGES=['D01','D02','D03','D04'];
const defaultDirector={D01:'P01',D02:'P02',D03:'P03',D04:'P04'};
const START_ENERGY=24, RESERVE=2;
const names={A:'Compréhension',B:'Confrontation',C:'Préservation'};
const nameById=Object.fromEntries(stations.map(s=>[s.id,s.name]));
const labels={intro:'Introduction',D01:'D01 · Choix',R1:'D01 · Scène',D02:'D02 · Choix',R2:'D02 · Scène',D03:'D03 · Choix',R3:'D03 · Scène',D04:'D04 · Choix',R4:'Bascule',FIN:'Conclusion'};
const steps=Object.keys(labels);
const app=document.querySelector('#app');
const fresh=()=>({view:'intro',returnView:'intro',picks:{D01:{},D02:{},D03:{},D04:{}},draft:{D01:{},D02:{},D03:{},D04:{}},director:{...defaultDirector},bypass:true,seconds:0,studio:true,ending:null});
let state=fresh(),timer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firstSentence=s=>String(s).replace(/\s+/g,' ').split(/(?<=[.!?])\s+/)[0]?.slice(0,240) || '';
const paragraphs=s=>String(s).split(/\n\n/).map(x=>`<p>${esc(x)}</p>`).join('');
function copy(o){return {...o,pts:[...o.pts],flags:[...o.flags]}}
function priorFlags(until){const f=new Set();for(let i=0;i<STAGES.indexOf(until);i++){const r=STAGES[i];for(const s of stations){const o=chosen(r,s.id);if(o)o.flags.forEach(x=>f.add(x))}}return f}
function optionsFor(round){if(round==='D01')return d1;if(round==='D02')return getD02(state.picks.D01);
  const raw=round==='D03'?d3:d4;const out=Object.fromEntries(stations.map(s=>[s.id,raw[s.id].map(copy)]));const f=priorFlags(round);
  if(round==='D03'){
    if(f.has('mara')||f.has('lia')||f.has('refuge'))out.P03[1].secondary='Les indices sur Mara et Lia permettent de comparer immédiatement les deux emplacements.';
    if(f.has('isole')||f.has('silence_radio'))out.P02[1].secondary='Canal externe isolé : seule la liaison interne vers le SAS reste accessible.';
    if(f.has('corridor')||f.has('route'))out.P01[2].secondary='Le corridor déjà calculé réduit les risques de cette observation.';
    if(f.has('sas')||f.has('sas_scan')||f.has('confinement'))out.P04[1].secondary='Protection préalable détectée : une comparaison des vibrations est disponible.';
  }else{
    if(!f.has('phase_cartographie')&&!f.has('horodatages_d03')&&!f.has('verite_amnesie')&&!f.has('essais')){out.P01[0].secondary+=' Le calibrage prendra plus de temps sans données temporelles.';out.P01[0].cost=2}
    if(!f.has('trace_sas')&&!f.has('cinquieme_dossier')&&!f.has('scan_sas_d03')&&!f.has('sas_scan')&&!f.has('sas')){out.P04[1].secondary+=' Sans repère préalable, le confinement consommera une unité additionnelle.';out.P04[1].cost=3}
    if(f.has('depart_possible')||f.has('route')||f.has('corridor')){out.P04[2].cost=0;out.P04[2].secondary+=' Trajectoire déjà identifiée : démarrage optimisé.'}
    if(f.has('contact_sas')||f.has('lia'))out.P02[1].secondary+=' Le canal enregistré auparavant est encore reconnu.';
    if(f.has('verite_amnesie')||f.has('memoire')||f.has('consentement'))out.P03[0].secondary+=' Les données médicales renforcent la cohérence du signal.';
  }
  return out;
}
function chosen(round,post){const id=state.picks[round][post];if(!id)return null;const options=optionsFor(round)[post]||[];return options.find(o=>o.id===id)||null}
function tally(stop='D04'){
 const score={A:0,B:0,C:0};const flags=new Set();let energy=START_ENERGY;
 for(const r of STAGES){for(const s of stations){const o=chosen(r,s.id);if(o){energy-=o.cost;score.A+=o.pts[0];score.B+=o.pts[1];score.C+=o.pts[2];o.flags.forEach(f=>flags.add(f))}}if(r===stop)break}
 return {energy,score,flags:[...flags]};
}
function endingLogic(){const t=tally(),max=Math.max(...Object.values(t.score)),ties=Object.keys(t.score).filter(k=>t.score[k]===max);let winner=ties[0],rule='L’orientation cumulative dominante.';
 if(ties.length>1){for(const s of ['P04','P03','P02','P01']){let opt=chosen('D04',s);if(!opt)continue;const map={A:opt.pts[0],B:opt.pts[1],C:opt.pts[2]};const x=Math.max(...ties.map(k=>map[k]));const local=ties.filter(k=>map[k]===x);if(local.length===1){winner=local[0];rule=`Égalité départagée par l’engagement D04 du poste ${nameById[s]}.`;break}}
 if(ties.includes(winner)&&t.score.A===t.score.B&&t.score.B===t.score.C){rule='Égalité parfaite : règle stable de départage A, puis B, puis C.'}}
 return {winner,rule,score:t.score,energy:t.energy,flags:t.flags};}
function resetFrom(round){let active=false;for(const r of STAGES){if(r===round){active=true;continue}if(active){state.picks[r]={};state.draft[r]={}}}state.ending=null}
function energyAt(round){const idx=STAGES.indexOf(round);return idx===0?START_ENERGY:tally(STAGES[idx-1]).energy}
function mediaPrompt(o){const place=/SAS/i.test(o.medium)?'le SAS projeté':/fenêtre/i.test(o.medium)?'la grande fenêtre orbitale sur Nacre':/Télévision/i.test(o.medium)?'la télévision de transmissions':/Son/i.test(o.medium)?'une séquence sonore immersive':'les écrans de contrôle du vaisseau';return `Créer pour ${place} une séquence courte de science-fiction réaliste et inquiétante intitulée « ${o.sceneTitle} ». ${firstSentence(o.script)} Prévoir des éléments sobres, réutilisables, sans dialogue imposé aux quatre joueurs.`}
function audioPrompt(o){let style=/SAS/i.test(o.medium)?'Trois coups métalliques spatialisés, pression de coque, silence tendu':/Télévision/i.test(o.medium)?'Souffle de transmission, signal intermittent, voix enregistrée ou synthétique':/fenêtre/i.test(o.medium)?'Grondement orbital grave, impulsion lointaine, montée discrète de tension':'Ventilation du cockpit, relais électriques, pulsations et silence contrôlé';return `Créer une piste audio courte pour « ${o.sceneTitle} » (${o.id}) : ${style}. Synchroniser les accents avec l'événement visuel. Aucune voix ni réaction des joueurs préenregistrée.`}
function headerInfo(round){let title={D01:'Première intervention',D02:'Les conséquences reviennent',D03:'La vérité morcelée',D04:'La dernière manœuvre'}[round];let desc={D01:'Quatre postes, trois actions chacun. Navigation détermine la scène centrale.',D02:'Les commandes reflètent les choix de D01. Communications dirige la scène.',D03:'Archives révèle l’histoire cachée. Vos précédents choix en modifient la lecture.',D04:'Systèmes conduit la scène finale des décisions; après cette fenêtre, la résolution est automatique.'}[round];return `<div class="section-lead"><div><div class="eyebrow">${round} / FENÊTRE DE DÉCISION</div><h1>${title}</h1><p>${desc}</p></div><div class="status-row"><span class="status-pill">Énergie <strong>${energyAt(round)} / ${START_ENERGY}</strong></span><span class="status-pill">4 postes</span><span class="status-pill">3 options / poste</span></div></div>`}
function renderIntro(){return `<div class="page page-fade"><div class="hero-layout"><section class="hero-text"><div class="eyebrow">TIDE · ÉCHO-7 · LA MÉMOIRE DES ABSENTS</div><h1>Vous vous réveillez.<br>Vous ne savez plus <span style="color:var(--cyan)">qui vous êtes.</span></h1><p class="lead">Quatre personnes reprennent conscience dans le cockpit d'un vaisseau immobilisé au-dessus de Nacre. Les fonctions vitales sont stables, mais les archives signalent cinq membres d'équipage. Le cinquième siège est vide.</p><p>Une voix automatique vous demande vos identités. Personne ne peut répondre. Peu après, deux messages portent la signature de Mara Voss : dans le premier, elle vous supplie de ne pas rétablir les transmissions; dans le second, elle affirme que quarante-trois personnes attendent un secours sur Nacre et que vous êtes leur dernier espoir.</p><p>Des coups inexplicables résonnent dans la coque. Il reste peu de temps avant une mystérieuse « marée de phase ». Le vaisseau ne dispose pas de l'énergie nécessaire pour tout examiner.</p><p class="quote">« Les systèmes ne peuvent traiter qu'une série d'interventions prioritaires. Chacun des quatre postes doit maintenant choisir. »</p><div class="pills"><span class="pill">Introduction cible : 5–7 min</span><span class="pill">D01 → D04</span><span class="pill">16 décisions retenues</span><span class="pill">3 conclusions sans échec</span></div><div class="action-row"><button class="primary-button" data-go="D01">Accéder aux quatre podiums →</button><button class="secondary-button" data-go="media">Consulter le catalogue des médias</button></div><p class="small-note">Ce texte résume l'introduction. Les scènes, vidéos et sons sont des fiches de production, pas des fichiers audiovisuels déjà réalisés.</p></section>${visualGroup({view:'intro'})}</div><div class="shelf"><div class="route-card"><div class="eyebrow">RÈGLE DE JEU</div><h3>Une intervention par poste, chaque fois</h3><p>Les quatre choix sont retenus simultanément. Un poste directeur contrôle la scène principale; les trois autres influencent les conséquences, l'énergie et les choix suivants. Après D04, une orientation émerge de l'ensemble de l'aventure. Il n'y a pas de « mauvaise fin ».</p></div></div></div>`}
function choiceRow(o,selected){return `<label class="radio-option ${selected?'selected':''}"><input type="radio" name="${esc(o.id.slice(0,7))}" data-post="${esc(o.id.split('-')[1])}" value="${esc(o.id)}" ${selected?'checked':''}><span class="radio-main"><b>${esc(o.title)}</b><small>${esc(o.secondary)}</small><span class="radio-meta"><span class="micro-pill energy">${o.cost<0?'+'+Math.abs(o.cost):'−'+o.cost} énergie</span><span class="micro-pill" title="Orientations de conception, invisibles pour les joueurs en version finale">A +${o.pts[0]} · B +${o.pts[1]} · C +${o.pts[2]}</span></span></span></label>`}
function decisionCard(s,opts,director,round){const select=state.draft[round][s.id];return `<fieldset class="podium ${director===s.id?'director':''}"><legend class="sr-only">${esc(s.name)}</legend><div class="podium-top"><span><small>${s.id} · ${esc(s.focus)}</small><b>${esc(s.name)}</b></span>${director===s.id?'<span class="director-tag">SCÈNE PRINCIPALE</span>':''}</div>${opts.map(o=>choiceRow(o,o.id===select)).join('')}</fieldset>`}
function currentExplain(round){let f=priorFlags(round);return round==='D01'?'Départ commun. Navigation est le premier poste directeur.':round==='D02'?'Les commandes de D02 ont été personnalisées selon les quatre actions de D01.':'Certaines descriptions et certains coûts tiennent compte des événements antérieurs. Les traces de choix restent conservées : '+([...f].slice(-5).join(' · ')||'aucune trace encore');}
function renderDecision(round){const options=optionsFor(round),director=state.director[round];return `<div class="page page-fade">${headerInfo(round)}<div class="decision-layout"><aside class="stage-left">${visualGroup({view:'decision'})}<div class="stage-details"><h3>Ce que le vaisseau sait</h3><p>${esc(currentExplain(round))}</p><div class="notice">${round==='D04'?'<strong>Dernière fenêtre :</strong> les actions choisies conduiront automatiquement à un protocole final.':'Chaque poste choisit une seule intervention. Les trois actions secondaires comptent autant pour les ressources et les orientations.'}</div><div class="score-shelf"><h3>Orientations accumulées</h3>${orientationBars(round==='D01'?null:STAGES[STAGES.indexOf(round)-1])}</div></div></aside><section><div class="podiums">${stations.map(s=>decisionCard(s,options[s.id],director,round)).join('')}</div><div class="choice-footer"><div class="choice-footer-top"><div><div class="eyebrow">QUATRE ACTIONS À CONFIRMER</div><div id="selectionSummary" class="score-line">0 / 4</div></div><button id="confirmAction" class="primary-button" disabled>Confirmer les quatre choix →</button></div><div class="readlock"><label><input id="enforceLock" type="checkbox" ${state.bypass?'':'checked'}> Verrou de lecture (8 secondes)</label><span id="lockStatus">${state.bypass?'Atelier : confirmation immédiate':'Lecture protégée'}</span></div><div id="errorBox" role="status" class="small-note error"></div>${state.studio?`<div class="small-note">Mode atelier · Poste directeur : <select id="directorSelect" aria-label="Poste directeur">${stations.map(s=>`<option value="${s.id}" ${director===s.id?'selected':''}>${s.id} · ${esc(s.name)}</option>`).join('')}</select> <span class="muted">En séance réelle, le poste directeur reste fixe.</span></div>`:''}</div>${catalog(round)}</section></div></div>`}
function orientationBars(stop){const score=stop?tally(stop).score:{A:0,B:0,C:0};const max=Math.max(1,...Object.values(score));return `<div class="orientation-bars">${Object.keys(score).map(k=>`<div class="orient"><span>${k} · ${names[k]}</span><div class="orient-bar ${k.toLowerCase()}"><span style="width:${score[k]/max*100}%"></span></div><b>${score[k]}</b></div>`).join('')}</div>`}

><div class="shelf"><div class="route-card"><h3>Traces conservées de l'aventure</h3><div class="tags">${out.flags.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</div></div></div></div>`}
